name: PWA QA Pipeline

on:
  push:
    branches: [ main, qa/final-pipeline ]
  pull_request:
    branches: [ main, qa/final-pipeline ]

jobs:
  ui-tests:
    name: QA Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run all Playwright tests
        run: npx playwright test --reporter=line

  security-scan:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    needs: ui-tests
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Start app locally
        run: |
          python3 -m http.server 4173 >/tmp/pwa-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not start in time" >&2
          cat /tmp/pwa-http.log || true
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}:/zap/wrk:rw \
            owasp/zap2docker-stable \
            zap-baseline.py -t http://127.0.0.1:4173 -g gen.conf -J zap-report.json -r zap-report.html || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.json
            zap-report.html
            gen.conf
