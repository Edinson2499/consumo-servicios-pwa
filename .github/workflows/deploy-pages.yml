name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_availability.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Pages availability
        id: pages_availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/pages")"

          if [ "$status_code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status_code" = "404" ]; then
            echo "GitHub Pages is not enabled for $REPOSITORY; skipping Pages artifact preparation."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unexpected status while checking GitHub Pages availability: $status_code" >&2
          cat "$response_file" >&2
          exit 1

      - name: Configure Pages
        if: steps.pages_availability.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare site
        if: steps.pages_availability.outputs.enabled == 'true'
        shell: bash
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          set -e
          if [ -z "$FIREBASE_CONFIG_JSON" ]; then
            echo "Missing FIREBASE_CONFIG_JSON secret" >&2
            exit 1
          fi

          rm -rf dist
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' ./ dist/

          # Create runtime JS that only exposes the secret config
          mkdir -p dist/js
          echo "// Firebase runtime config generated by CI" > dist/js/firebase-config.runtime.js
          printf 'window.__FIREBASE_CONFIG__ = %s\n' "$FIREBASE_CONFIG_JSON" >> dist/js/firebase-config.runtime.js

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const files = ['index.html', 'dashboard.html', 'registro.html', 'registrar.html'];

          for (const file of files) {
            const fullPath = path.join('dist', file);
            if (!fs.existsSync(fullPath)) {
              continue;
            }

            let html = fs.readFileSync(fullPath, 'utf8');
            if (!html.includes('js/firebase-config.runtime.js')) {
              html = html.replace(
                '<script src="js/firebase-config.js"></script>',
                '<script src="js/firebase-config.runtime.js"></script>\n  <script src="js/firebase-config.js"></script>'
              );
              fs.writeFileSync(fullPath, html);
            }
          }
          NODE

      - name: Upload artifact
        if: steps.pages_availability.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4