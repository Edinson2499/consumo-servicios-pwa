name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        shell: bash
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' ./ dist/

          mkdir -p dist/js
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            echo "// Firebase runtime config generated by CI" > dist/js/firebase-config.runtime.js
            printf 'window.__FIREBASE_CONFIG__ = %s\n' "$FIREBASE_CONFIG_JSON" >> dist/js/firebase-config.runtime.js
          else
            echo "Missing FIREBASE_CONFIG_JSON secret; continuing with placeholder runtime config" >&2
            cat > dist/js/firebase-config.runtime.js <<'EOF'
          window.__FIREBASE_CONFIG__ = {
            apiKey: "TU_API_KEY_AQUI",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project",
            storageBucket: "your-project.firebasestorage.app",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID",
            measurementId: "YOUR_MEASUREMENT_ID"
          };
          EOF
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const files = ['index.html', 'dashboard.html', 'registro.html', 'registrar.html'];

          for (const file of files) {
            const fullPath = path.join('dist', file);
            if (!fs.existsSync(fullPath)) {
              continue;
            }

            let html = fs.readFileSync(fullPath, 'utf8');
            if (!html.includes('js/firebase-config.runtime.js')) {
              html = html.replace(
                '<script src="js/firebase-config.js"></script>',
                '<script src="js/firebase-config.runtime.js"></script>\n  <script src="js/firebase-config.js"></script>'
              );
              fs.writeFileSync(fullPath, html);
            }
          }
          NODE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4