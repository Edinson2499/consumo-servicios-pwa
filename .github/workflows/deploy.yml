name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create Firebase config file
        shell: bash
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          set -euo pipefail

          mkdir -p js

          if [ -z "${FIREBASE_CONFIG_JSON:-}" ]; then
            echo "Missing FIREBASE_CONFIG_JSON secret" >&2
            exit 1
          fi

          cat > js/firebase-config.js <<EOF
          // Firebase Configuration (Generado automáticamente por CI/CD)
          const firebaseConfig = ${FIREBASE_CONFIG_JSON};
          const FIREBASE_CONFIGURED = Boolean(firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey !== "TU_API_KEY_AQUI");
          window.FIREBASE_CONFIGURED = FIREBASE_CONFIGURED;

          let firebaseApp = null;
          let auth = null;
          let db = null;

          window.firebaseApp = firebaseApp;
          window.auth = auth;
          window.db = db;

          if (FIREBASE_CONFIGURED) {
            try {
              firebaseApp = firebase.initializeApp(firebaseConfig);
              auth = firebase.auth();
              db = firebase.firestore();
              window.firebaseApp = firebaseApp;
              window.auth = auth;
              window.db = db;
              console.log("✅ Firebase inicializado correctamente");
            } catch (e) {
              console.warn("⚠️ Error al inicializar Firebase:", e);
            }
          }
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
