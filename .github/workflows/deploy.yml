name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create js/firebase-config.js from secret
        shell: bash
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          set -e
          mkdir -p js

          if [ -z "$FIREBASE_CONFIG_JSON" ]; then
            echo "Missing FIREBASE_CONFIG_JSON secret; falling back to placeholder config" >&2
            cat > js/firebase-config.js <<'EOF'
          // Firebase Configuration (placeholder fallback for CI)
          const firebaseConfig = {
            apiKey: "TU_API_KEY_AQUI",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project",
            storageBucket: "your-project.firebasestorage.app",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID",
            measurementId: "YOUR_MEASUREMENT_ID"
          };
          const FIREBASE_CONFIGURED = false;
          window.FIREBASE_CONFIGURED = FIREBASE_CONFIGURED;
          let firebaseApp = null;
          let auth = null;
          let db = null;
          window.firebaseApp = firebaseApp;
          window.auth = auth;
          window.db = db;
          EOF
            exit 0
          fi

          echo "// Firebase Configuration (Generado automáticamente por CI/CD)" > js/firebase-config.js
          printf 'const firebaseConfig = %s\n' "$FIREBASE_CONFIG_JSON" >> js/firebase-config.js
          printf 'const FIREBASE_CONFIGURED = Boolean(firebaseConfig && firebaseConfig.apiKey && firebaseConfig.apiKey != "TU_API_KEY_AQUI");\n' >> js/firebase-config.js
          printf 'window.FIREBASE_CONFIGURED = FIREBASE_CONFIGURED;\n' >> js/firebase-config.js
          printf 'let firebaseApp = null;\nlet auth = null;\nlet db = null;\n' >> js/firebase-config.js
          printf 'window.firebaseApp = firebaseApp;\nwindow.auth = auth;\nwindow.db = db;\n' >> js/firebase-config.js
          printf 'if (FIREBASE_CONFIGURED) { try { firebaseApp = firebase.initializeApp(firebaseConfig); auth = firebase.auth(); db = firebase.firestore(); window.firebaseApp = firebaseApp; window.auth = auth; window.db = db; } catch (e) { } }\n' >> js/firebase-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
